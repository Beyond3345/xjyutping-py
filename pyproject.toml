[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xjyutping"
version = "1.3.0"
description = "Convert Traditional Chinese text to Cantonese Jyutping (粵拼), with pronunciation chosen from context"
readme = "README.md"
requires-python = ">=3.8"
# the code is MIT; the data files in src/xjyutping/data are CC BY-SA 4.0
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE"]
keywords = ["jyutping", "cantonese", "romanization", "romanisation", "粵拼", "粵語", "chinese"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: Chinese (Traditional)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/Beyond3345/xjyutping-py"
Repository = "https://github.com/Beyond3345/xjyutping-py"
Issues = "https://github.com/Beyond3345/xjyutping-py/issues"
Changelog = "https://github.com/Beyond3345/xjyutping-py/blob/main/CHANGELOG.md"
"LaTeX package" = "https://github.com/Beyond3345/xjyutping-tex"

[project.optional-dependencies]
test = ["pytest>=6.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xjyutping = ["data/*.tsv"]
